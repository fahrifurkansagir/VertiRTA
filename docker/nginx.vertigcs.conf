server {
    listen 5180;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Preserve HTTP 206 byte-range integrity for self-hosted .pmtiles archives (no gzip wrapping)
    location ~* \.pmtiles$ {
        gzip off;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}\n';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
