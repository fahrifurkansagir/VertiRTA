# VertiRTA M3 Post-Flight Regulatory Forensics Configuration
# Design Drivers: Reg. (EU) 376/2014, CIR (EU) 2026/1821, CDR (EU) 2020/2034 (ERCS),
# EUROCAE ED-155A (March 2025), and SHGM SHY-OLAY (72h ADREP reporting).

schema_version: vertirta.forensics_config/v1.0.0
compliance_claim: NONE_RESEARCH_TESTBED_ONLY

airspace_and_jurisdiction:
  fir_uir_id_16: LTBB
  ats_unit_id_372: LTFJ_TWR
  state_area_id_454: TR
  location_name_id_440: Kartal_Sahil_Istanbul
  reporting_entity_id_453: VERTIRTA_RESEARCH_TESTBED
  datum_lat_deg: 40.8860
  datum_lon_deg: 29.1880
  max_corridor_lon_deg: 29.1895

ed155a_sidecar:
  vrta_header_bytes_frozen: 128
  vrta_frame_bytes_frozen: 256
  sidecar_extension: .vrta_events.jsonl
  join_key: [seq, t_sim_us]
  append_only_fsync: true
  hash_chain_algorithm: SHA-256
  signature_algorithm: Ed25519
  min_libsodium_version: "1.0.21"
  banned_libsodium_cve_max: "1.0.20"

cir_2026_1821_triggers:
  - FATO_INCURSION
  - USPACE_AIRBORNE_ENCOUNTER
  - CRITICAL_ENERGY_OR_ENVELOPE_PROT
  - PART_IS_INFOSEC_ANOMALY
  - UAS_CMU_TECHNICAL_FAULT

shgm_shy_olay:
  mandatory_reporting_deadline_hours: 72
  parallel_narrative_languages: [en, tr]
  article16_pii_redaction_required: true

ercs:
  regulation_ref: "CDR (EU) 2020/2034"
  default_occupant_capacity_x8_240: 1
  lift_cruise_occupant_capacity_band: [4, 6]
  draft_occurrence_class_id_431: INCIDENT_DRAFT_ONLY
  auto_classify_accident_or_serious_incident: false
  reporting_status: DRAFT_INTERNAL_PRE_SUBMISSION
  rotor_control_sw_cictt_code: SCF-NP
  barrier8_forced_zero_on_high_energy: true
  high_energy_key_risk_areas:
    - LOC_I_HIGH_ENERGY
    - MAC_HIGH_ENERGY
    - CFIT_HIGH_ENERGY
    - FIRE_THERMAL_HIGH_ENERGY
  omit_na_injury_attribute_ids: [114, 187, 262, 460, 462, 463, 469, 472]
  evtol_rotorcraft_phase_codes_id_121:
    takeoff: 10300
    initial_climb: 10302
    rejected_takeoff: 10303
