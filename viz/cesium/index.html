<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VertiRTA-X8-240 Live Tactical Earth Console (:5180)</title>
  <link
    rel="stylesheet"
    href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css"
  />
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0b1017;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #e6eef8;
    }
    #hud-panel {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      width: 300px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(11, 16, 23, 0.86);
      border: 1px solid rgba(18, 181, 203, 0.45);
      font-size: 12px;
      line-height: 1.5;
    }
    #hud-panel h1 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #12b5cb;
      letter-spacing: 0.04em;
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
    }
    .hud-disclaimer {
      margin-top: 8px;
      font-size: 10px;
      color: #f6b73c;
    }
    #cesium-credits {
      position: fixed;
      left: 12px;
      bottom: 8px;
      z-index: 20;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(11, 16, 23, 0.78);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <aside id="hud-panel" aria-label="VertiRTA Telemetry HUD">
    <h1>VERTIRTA-X8-240 // KARTAL LIVE OPS</h1>
    <div class="hud-row"><span>Link</span><strong id="hud-link">CONNECTING :5180</strong></div>
    <div class="hud-row"><span>Regime</span><strong id="hud-regime">NOMINAL_8_ROTOR</strong></div>
    <div class="hud-row"><span>Airspeed</span><strong id="hud-speed">0.0 m/s</strong></div>
    <div class="hud-row"><span>AGL / HAE</span><strong id="hud-alt">0.0 / 48.7 m</strong></div>
    <div class="hud-row"><span>Pack SoC / V</span><strong id="hud-batt">100.0% / 400.0 V</strong></div>
    <div class="hud-row"><span>TMR / CBF ||du||</span><strong id="hud-tmr">3/3 / 0.00</strong></div>
    <div class="hud-row"><span>LTFJ / LTBX Margin</span><strong id="hud-ctr">1042 / 2995 m</strong></div>
    <div class="hud-row"><span>Motor Mask</span><strong id="hud-mask">0xFF (8/8)</strong></div>
    <div class="hud-disclaimer">SIMULATION REFERENCE ONLY — NOT FOR NAVIGATION</div>
  </aside>
  <footer id="cesium-credits"></footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
